{% extends "base.html" %}
{% block title %}{{ t('contact.title') }}{% endblock %}
{% block content %}
<div class="max-w-3xl">
  <h1 class="text-4xl font-bold text-white mb-2">{{ t('contact.title') }}</h1>
  <div class="w-20 h-1 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-4"></div>
  <p class="text-gray-400 mb-10 max-w-xl">
    {{ t('contact.subtitle') }}
  </p>

  {% if request.query_params.get("success") %}
  <div class="mb-8 p-4 rounded-xl bg-green-500/10 border border-green-500/20 text-green-400 text-sm">
    {{ t('contact.success') }}
  </div>
  {% endif %}

  <form method="POST" action="/contact" class="space-y-5">
    <div class="grid md:grid-cols-2 gap-5">
      <div>
        <label for="name" class="block text-sm text-gray-400 mb-1.5">{{ t('contact.name') }}</label>
        <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-gray-700 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="{{ t('contact.name_placeholder') }}">
      </div>
      <div>
        <label for="email" class="block text-sm text-gray-400 mb-1.5">{{ t('contact.email') }}</label>
        <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-gray-700 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="{{ t('contact.email_placeholder') }}">
      </div>
    </div>
    <div>
      <label for="subject" class="block text-sm text-gray-400 mb-1.5">{{ t('contact.subject') }}</label>
      <input type="text" id="subject" name="subject" class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-gray-700 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors" placeholder="{{ t('contact.subject_placeholder') }}">
    </div>
    <div>
      <label for="message" class="block text-sm text-gray-400 mb-1.5">{{ t('contact.message') }}</label>
      <textarea id="message" name="message" required rows="6" class="w-full px-4 py-3 rounded-xl bg-dark-800 border border-gray-700 text-white text-sm placeholder-gray-500 focus:outline-none focus:border-blue-500 transition-colors resize-none" placeholder="{{ t('contact.message_placeholder') }}"></textarea>
    </div>
    <button type="submit" class="px-8 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-medium transition-all shadow-lg shadow-blue-500/20">
      {{ t('contact.send') }}
    </button>
  </form>
</div>
{% endblock %}
