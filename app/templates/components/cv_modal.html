<!-- CV Preview Modal -->
<div id="cv-modal" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeCvModal()"></div>
  <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
    <div class="bg-dark-800 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden shadow-2xl border border-gray-700">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-700">
        <h3 class="text-lg font-semibold text-white">{{ t('cv_modal.title') }}</h3>
        <div class="flex items-center gap-3">
          <a href="/api/cv/download" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            {{ t('cv_modal.download') }}
          </a>
          <button onclick="closeCvModal()" class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>
      <!-- PDF Viewer -->
      <div class="bg-dark-900" style="height: 70vh;">
        <iframe id="cv-frame" src="/api/cv/preview" class="w-full h-full" frameborder="0"></iframe>
      </div>
    </div>
  </div>
</div>
